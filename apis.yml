aid: carrot-fertility
name: Carrot Fertility
description: 'Carrot Fertility is a global fertility and family-building benefits
  platform for employers and health plans, providing members with comprehensive reproductive
  and family-forming support across more than 195 countries. Carrot covers fertility
  care and preservation (egg, sperm, and embryo freezing), IVF and other assisted
  reproduction, surrogacy, adoption, pregnancy and postpartum support, low- and no-cost
  fertility options, gender-affirming care, and menopause and midlife care. Delivered
  as a B2B employee benefit with member and provider portals, Carrot pairs concierge
  care navigation with a network of clinics and experts. The company is HIPAA-compliant
  and maintains SOC 2 Type II, ISO/IEC 27001, PCI DSS, and HITRUST attestations. This
  API Evangelist profile tracks Carrot as a healthcare provider surfaced from the Uncork
  Capital portfolio; Carrot does not currently publish a public developer API, SDKs,
  or developer portal.'
